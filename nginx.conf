server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The only other origin the page talks to is PostHog (EU) for anonymous
    # analytics, and only when the build sets NEXT_PUBLIC_POSTHOG_KEY.
    # 'unsafe-inline' is needed for the inline bootstrap scripts Next.js
    # writes into statically exported pages.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://eu.i.posthog.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Send www to the bare domain.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/manifest+json text/plain application/xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The service worker must always be revalidated so updates roll out.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Icons and the social image change rarely; cache for a day.
    location ~* ^/(icons/|favicon\.ico$|apple-touch-icon\.png$|og-image\.png$|icon\.svg$) {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://eu.i.posthog.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
